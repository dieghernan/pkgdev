url: https://dieghernan.github.io/pkgdev/

template:
  bootstrap: 5
  package: gitdevr
  theme: haddock
  opengraph:
    twitter:
      creator: "@dhernangomez"
      card: summary_large_image

authors:
  Diego Hernangómez:
    href: "https://dieghernan.github.io/"

reference:
- title: GitHub Actions workflow helpers
  desc: Create workflows for package checks, documentation and deployment.
- contents:
  - has_concept("actions")
- title: Documentation checking helpers
  desc: Inspect generated package documentation.
- contents:
  - has_concept("checks")
- title: Package maintenance helpers
  desc: Run package-wide maintenance tasks and manage ignore files.
- contents:
  - has_concept("maintenance")
- title: Documentation rendering helpers
  desc: Render **Quarto** sources and precompute vignettes.
- contents:
  - has_concept("renderers")
- title: internal
- contents:
  - pkgdev-package

articles:
- title: Package download statistics
  desc: Explore download statistics for packages maintained by the author.
  navbar: Downloads
  contents:
  - articles/downloads
- title: Precomputed vignette examples
  desc: Learn how to precompute **R Markdown** and **Quarto** vignettes.
  contents:
  - test-precompute-knitr
  - test-precompute-quarto
