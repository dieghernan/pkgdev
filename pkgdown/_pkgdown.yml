url: https://dieghernan.github.io/pkgdev/

template:
  bootstrap: 5
  package: gitdevr
  theme: haddock
  opengraph:
    twitter:
      creator: "@dhernangomez"
      card: summary_large_image

authors:
  Diego Hernangómez:
    href: "https://dieghernan.github.io/"

reference:
- title: Package overview
  desc: Learn about **pkgdev** and find related helpers.
- contents:
  - pkgdev-package
- title: Package maintenance helpers
  desc: >
    Run the maintenance workflow with `update_docs()` and manage ignore files
    with `add_global_gitgnore()`.
- contents:
  - has_concept("maintenance")
- title: Documentation rendering helpers
  desc: >
    Render **Quarto** documents and README files, or precompute
    **R Markdown** and **Quarto** vignettes.
- contents:
  - has_concept("renderers")
- title: Documentation checking helpers
  desc: Check generated Rd titles for sentence case and trailing periods.
- contents:
  - has_concept("checks")
- title: GitHub Actions workflow helpers
  desc: >
    Create workflows to check packages, update documentation and deploy
    **pkgdown** sites.
- contents:
  - has_concept("actions")

articles:
- title: Precomputed vignette examples
  desc: >
    Explore example inputs for `precompute_vignette()` in **R Markdown**
    and **Quarto** formats.
  navbar: Precomputation
  contents:
  - test-precompute-knitr
  - test-precompute-quarto
- title: Package download statistics
  desc: >
    Explore download counts for the author's packages on CRAN and
    **Posit Package Manager**.
  navbar: Downloads
  contents:
  - articles/downloads
